name: Deploy Noobius staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noobius-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify isolated staging and deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_ACCOUNT_ID: '818bac5a5a12b327928ded9344c453bb'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check for the Cloudflare deploy credential
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Set the CLOUDFLARE_API_TOKEN repository secret before deploying.' >&2
            exit 1
          fi
      - name: Check out the main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install the locked dependency tree
        run: npm ci --no-audit --no-fund
      - name: Verify staging database access
        run: ./node_modules/.bin/wrangler d1 migrations list DB --remote --config deploy/cloudflare/staging-game.json
      - name: Deploy staging without token payments
        run: npm run deploy:staging
      - name: Run hosted staging smoke
        run: npm run smoke:staging
